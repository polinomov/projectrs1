<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>WebGL2 uint texture - resizable</title>
<style>
  body {
    background:#220; margin:0;
    display:flex; height:100vh;
    justify-content:center; align-items:center;
  }
  canvas {
    width:70vw;
    height:70vh;
    image-rendering: pixelated;
    border:1px solid #444;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl2");
if (!gl) throw "WebGL2 is required";

//-----------------------------------------------------
// Resize support (HiDPI safe)
//-----------------------------------------------------
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.floor(canvas.clientWidth  * dpr);
    const h = Math.floor(canvas.clientHeight * dpr);

    if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
}

window.addEventListener("resize", () => { resizeCanvas(); draw(); });
resizeCanvas();

//-----------------------------------------------------
// Shaders
//-----------------------------------------------------
const vsSrc = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main(){
    v_uv = (a_pos * 0.5) + 0.5;
    gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const fsSrc = `#version 300 es
precision highp float;
precision highp usampler2D;

in vec2 v_uv;
uniform usampler2D u_tex;
out vec4 outColor;

void main() {
    uint v = texture(u_tex, v_uv).r;
    float f = float(v) / 255.0;
    outColor = vec4(f, f, f, 1.0);
}`;

function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw gl.getShaderInfoLog(s);
    return s;
}

const vs = compile(gl.VERTEX_SHADER, vsSrc);
const fs = compile(gl.FRAGMENT_SHADER, fsSrc);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw gl.getProgramInfoLog(prog);
gl.useProgram(prog);

//-----------------------------------------------------
// Fullscreen quad
//-----------------------------------------------------
const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1,-1,
     1,-1,
    -1, 1,
     1, 1
]), gl.STATIC_DRAW);

const loc = gl.getAttribLocation(prog, "a_pos");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

//-----------------------------------------------------
// UInt texture (R32UI)
//-----------------------------------------------------
const W = 256, H = 256;
const data = new Uint32Array(W * H);

for (let y = 0; y < H; y++)
for (let x = 0; x < W; x++)
    data[y * W + x] = 255;//((x>>4) ^ (y>>4)) ? 255 : 128;

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R32UI, W, H);
gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RED_INTEGER, gl.UNSIGNED_INT, data);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

gl.uniform1i(gl.getUniformLocation(prog, "u_tex"), 0);

//-----------------------------------------------------
// Draw
//-----------------------------------------------------
function draw() {
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

draw();
</script>
</body>
</html>
